<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Suporte — Indisponível</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue-900: #042C53; --blue-800: #0C447C; --blue-600: #185FA5;
      --blue-400: #378ADD; --blue-100: #B5D4F4; --blue-50: #E6F1FB;
      --white: #ffffff; --gray-500: #5a7a99; --gray-700: #2d4a66;
      --radius-lg: 14px; --radius-xl: 22px;
      --font: system-ui, -apple-system, sans-serif;
    }
    body {
      font-family: var(--font);
      background: linear-gradient(135deg, var(--blue-900) 0%, var(--blue-600) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(4,44,83,0.3);
      backdrop-filter: blur(4px);
    }
    .topbar i { color: var(--blue-100); font-size: 22px; }
    .topbar span { color: var(--white); font-size: 16px; font-weight: 500; }
    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      box-shadow: 0 8px 40px rgba(4,44,83,0.30);
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
    }
    .icon-wrap {
      width: 88px; height: 88px;
      background: var(--blue-50);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.75rem;
    }
    .icon-wrap i { font-size: 44px; color: var(--blue-600); }
    h1 { font-size: 22px; font-weight: 600; color: var(--blue-800); margin-bottom: 0.6rem; }
    .subtitle {
      font-size: 14px; font-weight: 500; color: var(--blue-400);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 1.25rem;
    }
    p { font-size: 14px; color: var(--gray-500); line-height: 1.6; margin-bottom: 0; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #FFF3E0; color: #BF360C;
      font-size: 12px; font-weight: 500; padding: 6px 16px; border-radius: 999px;
      margin-top: 1.5rem;
    }
    footer { margin-top: 2rem; font-size: 12px; color: rgba(255,255,255,0.6); }
    @media (max-width: 480px) { .card { padding: 2.5rem 1.75rem; } h1 { font-size: 19px; } }
  </style>
</head>
<body>

  <div class="topbar">
    <i class="ti ti-headset"></i>
    <span>Central de Suporte</span>
  </div>

  <div class="card">
    <div class="icon-wrap">
      <i class="ti ti-beach"></i>
    </div>
    <div class="subtitle">Suporte de férias</div>
    <h1>Site suspenso temporariamente</h1>
    <p>Nossa equipe está de férias e a abertura de novos chamados está pausada neste momento. Voltaremos em breve para atender sua solicitação.</p>
    <div class="badge">
      <i class="ti ti-clock-pause" style="font-size:13px"></i> Retorno em breve
    </div>
  </div>

  <footer>Central de Suporte &copy; 2025</footer>

</body>
</html>
